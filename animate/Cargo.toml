[package]
name = "animate"
version.workspace = true
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[dependencies]
animate-core = { path = "../animate-core", package = "animate-core", version = "0.5.0" }
animate-macros = { path = "../animate-macros", package = "animate-macros", version = "0.5.0", optional = true }
ratatui = { version = "0.30", optional = true }

[dev-dependencies]
ratatui = "0.30"
crossterm = "0.29"
criterion = "0.8"

[features]
default = ["macros", "global-clock"]
macros = ["dep:animate-macros"]
global-clock = ["animate-core/global-clock"]
ratatui = ["dep:ratatui", "animate-core/ratatui"]

[[bench]]
name = "animate"
harness = false
